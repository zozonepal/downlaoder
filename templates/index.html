<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediaFetch.io - YouTube Downloader PWA</title>
  
  <!-- PWA Headers -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0b1120">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #0b1120;
      color: #e2e8f0;
      font-family: 'Inter', sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-start p-4 md:p-8">

  <!-- Header -->
  <header class="w-full max-w-4xl flex items-center justify-between py-4 mb-6 border-b border-slate-800">
    <div class="flex items-center space-x-3">
      <div class="bg-red-600 p-2 rounded-xl shadow-lg shadow-red-500/30">
        <i class="fa-solid fa-cloud-arrow-down text-2xl text-white"></i>
      </div>
      <h1 class="text-2xl font-bold tracking-tight">MediaFetch<span class="text-red-500">.io</span></h1>
    </div>
    <div class="text-sm text-slate-400 space-x-6">
      <a href="#" class="hover:text-white transition">PWA Mobile Ready</a>
    </div>
  </header>

  <!-- Input Section -->
  <div class="w-full max-w-4xl bg-slate-900/80 border border-slate-800 rounded-2xl p-4 shadow-xl mb-8">
    <form id="fetchForm" class="flex flex-col sm:flex-row gap-3">
      <div class="relative flex-1">
        <i class="fa-brands fa-youtube absolute left-4 top-1/2 -translate-y-1/2 text-slate-500 text-lg"></i>
        <input 
          type="url" 
          id="urlInput"
          placeholder="https://www.youtube.com/watch?v=..." 
          required
          class="w-full bg-slate-950 border border-slate-800 rounded-xl pl-11 pr-20 py-3.5 text-slate-200 placeholder-slate-500 focus:outline-none focus:border-red-500 transition"
        >
        <button 
          type="button" 
          id="pasteBtn"
          class="absolute right-3 top-1/2 -translate-y-1/2 text-xs text-slate-400 bg-slate-800 hover:bg-slate-700 px-2.5 py-1.5 rounded-lg transition"
        >
          <i class="fa-regular fa-paste mr-1"></i> Paste
        </button>
      </div>
      <button 
        type="submit" 
        id="fetchBtn"
        class="bg-red-600 hover:bg-red-500 text-white font-medium px-6 py-3.5 rounded-xl flex items-center justify-center shadow-lg shadow-red-600/30 transition shrink-0"
      >
        <i class="fa-solid fa-magnifying-glass mr-2"></i> Fetch Info
      </button>
    </form>
  </div>

  <!-- Status / Loader -->
  <div id="loader" class="hidden w-full max-w-4xl text-center py-10">
    <div class="inline-block animate-spin rounded-full h-10 w-10 border-4 border-slate-700 border-t-red-500 mb-3"></div>
    <p class="text-slate-400">Fetching video information from YouTube...</p>
  </div>

  <div id="errorAlert" class="hidden w-full max-w-4xl bg-red-950/50 border border-red-800 text-red-200 p-4 rounded-xl mb-8">
    <i class="fa-solid fa-circle-exclamation mr-2"></i> <span id="errorText"></span>
  </div>

  <!-- Video Details & Formats Panel -->
  <div id="resultPanel" class="hidden w-full max-w-4xl bg-slate-900/90 border border-slate-800 rounded-2xl p-6 shadow-2xl mb-8">
    <!-- Meta Info -->
    <div class="flex flex-col md:flex-row gap-6 mb-8">
      <div class="relative shrink-0 w-full md:w-64 rounded-xl overflow-hidden shadow-lg border border-slate-800">
        <img id="thumbImg" src="" alt="Thumbnail" class="w-full h-full object-cover">
        <span id="durationBadge" class="absolute bottom-2 right-2 bg-black/80 text-white text-xs px-2 py-1 rounded font-mono">00:00</span>
      </div>
      <div class="flex flex-col justify-center">
        <span id="channelName" class="text-xs font-semibold text-red-400 uppercase tracking-wider mb-1">Channel</span>
        <h2 id="videoTitle" class="text-xl md:text-2xl font-bold text-slate-100 mb-2 leading-tight">Video Title</h2>
        <p id="viewCount" class="text-sm text-slate-400"><i class="fa-regular fa-eye mr-1"></i> 0 views</p>
      </div>
    </div>

    <!-- Quality Selection -->
    <div class="border-t border-slate-800 pt-6">
      <div class="flex items-center space-x-2 text-slate-300 font-semibold mb-4">
        <i class="fa-solid fa-sliders text-red-500"></i>
        <span>Select Quality / Format</span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        <div>
          <h3 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-3 flex items-center">
            <i class="fa-solid fa-video text-blue-400 mr-2"></i> Video Formats (MP4)
          </h3>
          <div id="videoList" class="space-y-2.5"></div>
        </div>

        <div>
          <h3 class="text-xs font-bold text-slate-400 tracking-wider uppercase mb-3 flex items-center">
            <i class="fa-solid fa-music text-green-400 mr-2"></i> Audio Only (MP3/M4A)
          </h3>
          <div id="audioList" class="space-y-2.5"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentVideoUrl = "";

    // Service Worker Registration for PWA
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }

    document.getElementById('pasteBtn').addEventListener('click', async () => {
      try {
        const text = await navigator.clipboard.readText();
        document.getElementById('urlInput').value = text;
      } catch (err) {
        alert("Clipboard permission denied");
      }
    });

    document.getElementById('fetchForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const url = document.getElementById('urlInput').value.trim();
      if (!url) return;

      currentVideoUrl = url;
      showLoader(true);
      hideError();
      document.getElementById('resultPanel').classList.add('hidden');

      try {
        const response = await fetch('/api/info', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url })
        });

        const data = await response.json();
        showLoader(false);

        if (!response.ok) {
          showError(data.error || 'Failed to fetch details.');
          return;
        }

        renderVideoInfo(data);
      } catch (err) {
        showLoader(false);
        showError('Could not connect to backend server. Make sure Python is running.');
      }
    });

    function renderVideoInfo(data) {
      document.getElementById('thumbImg').src = data.thumbnail;
      document.getElementById('videoTitle').textContent = data.title;
      document.getElementById('channelName').textContent = data.uploader;
      document.getElementById('durationBadge').textContent = data.duration;
      document.getElementById('viewCount').innerHTML = `<i class="fa-regular fa-eye mr-1"></i> ${data.views} views`;

      const videoList = document.getElementById('videoList');
      videoList.innerHTML = '';
      data.video_formats.forEach(item => {
        videoList.appendChild(createDownloadButton(item, 'video'));
      });

      const audioList = document.getElementById('audioList');
      audioList.innerHTML = '';
      data.audio_formats.forEach(item => {
        audioList.appendChild(createDownloadButton(item, 'audio'));
      });

      document.getElementById('resultPanel').classList.remove('hidden');
    }

    function createDownloadButton(item, type) {
      const btn = document.createElement('button');
      btn.className = "w-full bg-slate-950 hover:bg-slate-800 border border-slate-800 hover:border-slate-700 p-3.5 rounded-xl flex items-center justify-between transition group text-left";
      
      const icon = type === 'video' ? 'fa-film text-blue-400' : 'fa-file-audio text-green-400';

      btn.innerHTML = `
        <div class="flex items-center space-x-3">
          <i class="fa-solid ${icon}"></i>
          <span class="text-sm font-medium text-slate-200">${item.label}</span>
        </div>
        <div class="flex items-center space-x-2 text-slate-400 group-hover:text-white">
          <i class="fa-solid fa-download text-sm"></i>
        </div>
      `;

      btn.onclick = () => startDownload(item.format_id, item.ext);
      return btn;
    }

    async function startDownload(format_id, ext) {
      showLoader(true);
      hideError();

      try {
        const response = await fetch('/api/download', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ url: currentVideoUrl, format_id, ext })
        });

        if (!response.ok) {
          const data = await response.json();
          showLoader(false);
          showError(data.error || 'Download failed.');
          return;
        }

        const blob = await response.blob();
        const downloadUrl = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = downloadUrl;
        a.download = `video.${ext}`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        showLoader(false);
      } catch (err) {
        showLoader(false);
        showError('Failed to complete download request.');
      }
    }

    function showLoader(show) {
      document.getElementById('loader').classList.toggle('hidden', !show);
    }

    function showError(msg) {
      document.getElementById('errorText').textContent = msg;
      document.getElementById('errorAlert').classList.remove('hidden');
    }

    function hideError() {
      document.getElementById('errorAlert').classList.add('hidden');
    }
  </script>
</body>
</html>
